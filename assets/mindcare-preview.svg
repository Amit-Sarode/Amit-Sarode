<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="850" height="420" fill="url(#grid)"/>
  </g>

  <!-- Glowing Accent Circles -->
  <circle cx="750" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="340" r="140" fill="#0d9488" opacity="0.1" filter="url(#glow)"/>

  <!-- Browser/App Header Bar -->
  <rect x="30" y="30" width="790" height="360" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="30" width="790" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Circle Buttons -->
  <circle cx="55" cy="50" r="6" fill="#ef4444"/>
  <circle cx="75" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="50" r="6" fill="#10b981"/>
  <!-- URL Bar -->
  <rect x="120" y="38" width="400" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="135" y="54" fill="#94a3b8" font-size="12" font-weight="500">https://mindcare-ebon-iota.vercel.app</text>

  <!-- Main Content Area Wireframe -->
  <!-- Header Title -->
  <text x="60" y="115" fill="#f8fafc" font-size="24" font-weight="700">🩺 MindCare — AI Healthcare Assistant</text>
  <text x="60" y="140" fill="#94a3b8" font-size="14">Intelligent patient intake, symptom triage, and 24/7 automated booking</text>

  <!-- Feature Cards Grid -->
  <rect x="60" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" opacity="0.9"/>
  <text x="80" y="200" fill="#38bdf8" font-size="14" font-weight="600">💬 AI Triage Chat</text>
  <text x="80" y="225" fill="#cbd5e1" font-size="12">Pre-screens symptoms</text>
  <text x="80" y="245" fill="#cbd5e1" font-size="12">Natural conversation</text>
  <text x="80" y="265" fill="#cbd5e1" font-size="12">Emergency escalation</text>

  <rect x="315" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="335" y="200" fill="#38bdf8" font-size="14" font-weight="600">📅 Instant Booking</text>
  <text x="335" y="225" fill="#cbd5e1" font-size="12">Real-time slots</text>
  <text x="335" y="245" fill="#cbd5e1" font-size="12">Automated reminders</text>
  <text x="335" y="265" fill="#cbd5e1" font-size="12">80% call reduction</text>

  <rect x="570" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="590" y="200" fill="#38bdf8" font-size="14" font-weight="600">⚡ Tech Stack</text>
  <text x="590" y="225" fill="#cbd5e1" font-size="12">React 19 &amp; TypeScript</text>
  <text x="590" y="245" fill="#cbd5e1" font-size="12">OpenAI GPT-4 API</text>
  <text x="590" y="265" fill="#cbd5e1" font-size="12">Tailwind &amp; Node.js</text>

  <!-- Bottom Banner -->
  <rect x="60" y="340" width="730" height="35" rx="6" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="425" y="362" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">💡 Drop 5-10s ScreenToGif demo loop into assets/mindcare-demo.gif to replace preview</text>
</svg>
