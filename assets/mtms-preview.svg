<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="420" fill="url(#bgGrad)"/>
  
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="850" height="420" fill="url(#grid)"/>
  </g>

  <circle cx="720" cy="90" r="130" fill="#818cf8" opacity="0.1" filter="url(#glow)"/>
  <circle cx="120" cy="330" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Window Container -->
  <rect x="30" y="30" width="790" height="360" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="30" width="790" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="50" r="6" fill="#ef4444"/>
  <circle cx="75" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="50" r="6" fill="#10b981"/>
  <rect x="120" y="38" width="400" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="135" y="54" fill="#94a3b8" font-size="12" font-weight="500">https://mtms-liart.vercel.app</text>

  <!-- Header Title -->
  <text x="60" y="115" fill="#f8fafc" font-size="24" font-weight="700">📊 MTMS — Multi-Tenant Team &amp; Operations SaaS</text>
  <text x="60" y="140" fill="#94a3b8" font-size="14">Enterprise shift scheduling, multi-tenant workflows, and RBAC team management</text>

  <!-- SaaS Dashboard Layout Mockup -->
  <rect x="60" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <text x="80" y="200" fill="#818cf8" font-size="14" font-weight="600">🏢 Multi-Tenant RBAC</text>
  <text x="80" y="225" fill="#cbd5e1" font-size="12">Role isolation &amp; auth</text>
  <text x="80" y="245" fill="#cbd5e1" font-size="12">Audit trail logs</text>
  <text x="80" y="265" fill="#cbd5e1" font-size="12">Custom organizational trees</text>

  <rect x="315" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="335" y="200" fill="#818cf8" font-size="14" font-weight="600">🗓️ Shift Rostering</text>
  <text x="335" y="225" fill="#cbd5e1" font-size="12">Automated schedules</text>
  <text x="335" y="245" fill="#cbd5e1" font-size="12">Real-time team sync</text>
  <text x="335" y="265" fill="#cbd5e1" font-size="12">Shift conflict resolution</text>

  <rect x="570" y="170" width="220" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="590" y="200" fill="#818cf8" font-size="14" font-weight="600">⚡ Tech Stack</text>
  <text x="590" y="225" fill="#cbd5e1" font-size="12">React &amp; TypeScript</text>
  <text x="590" y="245" fill="#cbd5e1" font-size="12">Node.js &amp; REST APIs</text>
  <text x="590" y="265" fill="#cbd5e1" font-size="12">Tailwind CSS SaaS UI</text>

  <rect x="60" y="340" width="730" height="35" rx="6" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="425" y="362" fill="#818cf8" font-size="13" font-weight="600" text-anchor="middle">💡 Drop 5-10s ScreenToGif demo loop into assets/mtms-demo.gif to replace preview</text>
</svg>
