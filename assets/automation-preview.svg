<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="background:#090d16; font-family:'Fira Code', Consolas, Monaco, monospace; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="420" fill="url(#bgGrad)"/>
  
  <!-- Glowing Accent -->
  <circle cx="700" cy="100" r="140" fill="#34d399" opacity="0.1" filter="url(#glow)"/>
  <circle cx="150" cy="300" r="120" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Terminal Window Container -->
  <rect x="30" y="30" width="790" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="30" y="30" width="790" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="50" r="6" fill="#ef4444"/>
  <circle cx="75" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="50" r="6" fill="#10b981"/>
  <text x="120" y="55" fill="#94a3b8" font-size="13" font-weight="600">terminal — autonomous-browser-engine (rewards-farmer)</text>

  <!-- Terminal Text Output Mockup -->
  <text x="60" y="100" fill="#34d399" font-size="14" font-weight="600">$ python -m automation.engine --agent-llm gpt-4o --kinematics bezier</text>
  <text x="60" y="125" fill="#64748b" font-size="13">[INFO] Initializing Headless Chromium Session with Bézier Trajectory Engine...</text>
  <text x="60" y="145" fill="#38bdf8" font-size="13">[AGENT] Evaluating DOM tree with LLM Vision &amp; Fitts' Law movement planner...</text>
  <text x="60" y="165" fill="#a7f3d0" font-size="13">[MOUSE] Simulating human-like cursor curve (Control Points: P0(120,450) -&gt; P3(840,210))</text>
  <text x="60" y="185" fill="#64748b" font-size="13">[INFO] Stealth score: 99.8% (Bypassed Cloudflare Bot Detection)</text>
  <text x="60" y="205" fill="#f59e0b" font-size="13">[DATA] Extracted 42 structured data payloads from dynamic single-page web app</text>
  <text x="60" y="225" fill="#34d399" font-size="13">[SUCCESS] Autonomous workflow completed cleanly in 3.42s 🚀</text>

  <!-- Bézier Curve Visual Graphic -->
  <path d="M 600 320 C 650 210, 720 350, 770 240" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="600" cy="320" r="4" fill="#34d399"/>
  <circle cx="770" cy="240" r="4" fill="#34d399"/>
  <text x="620" y="280" fill="#a7f3d0" font-size="11">Bézier Kinematic Path</text>

  <rect x="60" y="340" width="730" height="35" rx="6" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="425" y="362" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">💡 Drop 5-10s terminal/execution loop into assets/automation-demo.gif to replace preview</text>
</svg>
